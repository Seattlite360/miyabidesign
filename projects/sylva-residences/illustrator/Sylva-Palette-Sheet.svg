  <text x="45" y="760" font-family="Newsreader, Georgia, serif" font-style="italic" font-size="16" fill="#5B4E42">Values match sylva-palette-type-spec.md — eyedropper is unnecessary if the .ase libraries in assets/swatches are loaded.</text>
